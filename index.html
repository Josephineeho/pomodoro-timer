<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A pomodoro Timer</title>
</head>
<body>
    <div class="container">
        <h1><span class="line1"></span> Pomodoro Timer <span class="line2"></span></h1>
        <div class="miniContain">

            <span class="length11">
            <p class="length1">Break length</p>
            <span id="minusBtn">-</span>
            <span id="numbsVarry">00</span>
            <span id="plusBtn">+</span>
            </span>

            <div class="timer">
                <div id="border">
                    <img src="pic.png" alt="" class="pic">
                    <p id="textLabel">00:00:00</p>
                </div>
            </div>
            <span class="length22">
            <p class="length2">Session length</p>
            <span id="sessionMinusBtn">-</span>
            <span id="numbsVarry2">25</span>
            <button id="sessionPlusBtn">+</button>            
            </span><br><br>

            <button id="stopBtn"><span class="emoji2">&#9208</span>STOP</button>
            
            <button id="startBtn"><span class="emoji2">⨞</span>START</button>

            <button id="resetBtn"><span class="emoji2">&#8634</span>  RESET</button>
           



        </div>







    </div>
    



    <script src="index.js"></script>
</body>
</html>
